<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>財務經濟學 - 預測市場專屬密碼查詢</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --border-color: #2a364f;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .query-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.35rem;
            color: #f8fafc;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--accent-blue), #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .password-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 2px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="query-card">
        <h2>🔒 預測市場個人密碼查詢</h2>
        <p class="subtitle">請輸入您的「學號」與「姓名」以查詢您的專屬下單密碼</p>

        <div class="form-group">
            <label>學生學號</label>
            <input type="text" id="studentId" placeholder="例如：411571069">
        </div>

        <div class="form-group">
            <label>學生姓名</label>
            <input type="text" id="studentName" placeholder="例如：周書宇">
        </div>

        <button onclick="queryPassword()">查詢密碼</button>

        <div id="resultBox" class="result-box">
            <div id="resultText" style="font-size: 0.9rem; color: var(--text-muted);">查詢結果</div>
            <div id="passwordValue" class="password-display">--</div>
        </div>
    </div>

        function cleanStr(str) {
            return str ? str.trim().replace(/\s+/g, '') : '';
        }

        function queryPassword() {
            const inputId = cleanStr(document.getElementById('studentId').value);
            const inputName = cleanStr(document.getElementById('studentName').value);
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const passwordValue = document.getElementById('passwordValue');

            resultBox.style.display = 'block';

            if (!inputId || !inputName) {
                resultBox.className = 'result-box error';
                resultText.innerText = '輸入錯誤';
                passwordValue.innerText = '請完整輸入學號與姓名';
                return;
            }

            // 比對學號與姓名
            const matched = STUDENT_DATABASE.find(s => s.id === inputId && cleanStr(s.name) === inputName);

            if (matched) {
                resultBox.className = 'result-box';
                resultText.innerText = `查詢成功！(${matched.name} 同學)`;
                passwordValue.innerText = matched.pass;
            } else {
                resultBox.className = 'result-box error';
                resultText.innerText = '查無此人';
                passwordValue.innerText = '學號或姓名不符，請重新確認';
            }
        }

</body>
</html>
