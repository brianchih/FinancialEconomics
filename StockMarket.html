<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0050 預測市場 - CSV 自動撮合系統</title>
    <!-- 引入 PapaParse 解析 CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --buy-color: #ef5350; /* 臺股慣例：紅買 */
            --buy-bg: rgba(239, 83, 80, 0.15);
            --sell-color: #26a69a; /* 臺股慣例：綠賣 */
            --sell-bg: rgba(38, 166, 154, 0.15);
            --border-color: #333;
            --accent-color: #ffb74d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            background: var(--accent-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: #121212;
        }

        button:hover {
            opacity: 0.9;
        }

        .orderbook-table, .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .orderbook-table th, .data-table th {
            background-color: #2a2a2a;
            color: #bbb;
            padding: 10px;
        }

        .orderbook-table td, .data-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sell-row { color: var(--sell-color); background-color: var(--sell-bg); }
        .buy-row { color: var(--buy-color); background-color: var(--buy-bg); }

        .log-container {
            height: 220px;
            overflow-y: auto;
            background-color: #181818;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #4caf50;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            float: right;
        }
    </style>
</head>
<body>

    <div class="header-info">
        <div>
            <h2>0050 收盤價預測市場 — 自動撮合大螢幕</h2>
            <small style="color: #888;">
                <span class="status-dot"></span>系統連線中 (每 5 秒自動讀取 Google 表單 CSV)
            </small>
        </div>
        <div style="font-size: 24px; font-weight: bold; color: var(--accent-color);">
            最新成交價：<span id="last-price">--</span> 元
        </div>
    </div>

    <!-- CSV 網址連結顯示 -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>🔗 綁定 Google 表單 CSV 來源</h3>
        <input type="text" id="csv-url-input" readonly>
        <div style="font-size: 0.85rem; color: #aaa;">
            ※ 自動將表單數據讀入並進行「價格優先、時間優先」撮合。
        </div>
    </div>

    <div class="grid-container">
        <!-- 五檔掛單區 -->
        <div class="card">
            <h3>最佳五檔掛單 (Order Book)</h3>
            <table class="orderbook-table">
                <thead>
                    <tr><th>買/賣</th><th>委託價格</th><th>委託股數</th></tr>
                </thead>
                <tbody id="orderbook-body"></tbody>
            </table>
        </div>

        <!-- 撮合紀錄 -->
        <div class="card">
            <h3>市場交易日誌 (Market Log)</h3>
            <div class="log-container" id="market-log">
                <div>[系統] 撮合引擎啟動，載入預設 CSV...</div>
            </div>
        </div>
    </div>

    <!-- 13 組資產監控 -->
    <div class="card">
        <button class="btn-reset" onclick="resetMarket()">重置市場資料</button>
        <h3>交易者資產即時監控 (第 1 組 ~ 第 13 組)</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>組別</th>
                    <th>現金餘額 (Cash)</th>
                    <th>股票持股 (0050 股數)</th>
                    <th>凍結現金 (委託中)</th>
                    <th>凍結股票 (委託中)</th>
                    <th>參考總資產 (最新價計)</th>
                </tr>
            </thead>
            <tbody id="trader-asset-body"></tbody>
        </table>
    </div>

    <script>
        // 預設固定 CSV 網址
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTPr70gIiLYz47FcLz0BVXg7TnOsRAuF_z0_garnphHEYGnbt82LFIkLGRqdIoLPtVLZmAOpk83hjw/pub?gid=980221433&single=true&output=csv";
        
        const DEFAULT_PASSWORD = "0000";
        const INITIAL_CASH = 1000000;
        const INITIAL_STOCK = 5000; // 預設 5,000 股 (等同 5 張)

        let lastPrice = null;
        let processedRowCount = 0; // 記錄已處理的 CSV 行數
        let syncTimer = null;

        // 初始化 13 組資產 (每組 $1,000,000 + 5,000 股)
        let traders = {};
        for (let i = 1; i <= 13; i++) {
            traders[`第 ${i} 組`] = {
                password: DEFAULT_PASSWORD,
                cash: INITIAL_CASH,
                stock: INITIAL_STOCK,
                frozenCash: 0,
                frozenStock: 0
            };
        }

        let buyOrders = [];
        let sellOrders = [];

        window.onload = function() {
            document.getElementById('csv-url-input').value = CSV_URL;
            updateTraderTable();
            renderOrderBook();
            startAutoSync();
        };

        function startAutoSync() {
            logMarket("[系統] 開始輪詢 Google 表單數據...");
            fetchAndProcessCSV();

            if (syncTimer) clearInterval(syncTimer);
            syncTimer = setInterval(fetchAndProcessCSV, 5000); // 每 5 秒自動讀取一次
        }

        function fetchAndProcessCSV() {
            // 加入時間戳記網址避免瀏覽器快取舊資料
            const requestUrl = CSV_URL + "&t=" + new Date().getTime();
            Papa.parse(requestUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processNewOrders(results.data);
                }
            });
        }

        // 解析並處理新產生的表單資料
        function processNewOrders(rows) {
            if (rows.length <= processedRowCount) return; // 無新資料

            for (let i = processedRowCount; i < rows.length; i++) {
                const row = rows[i];
                
                // 讀取 Google 表單回應欄位
                const group = row["組別"] ? row["組別"].trim() : "";
                const password = row["驗證密碼"] ? row["驗證密碼"].trim() : "";
                const typeRaw = row["買賣類別"] ? row["買賣類別"].trim() : "";
                const price = parseFloat(row["委託價格"]);
                
                // 相容處理：若表單填寫的是 "1" (張) 或 "1000" (股)
                let qtyRaw = parseInt(row["委託數量"]);
                let qty = qtyRaw;
                if (!isNaN(qtyRaw) && qtyRaw <= 5) {
                    qty = qtyRaw * 1000; // 自動換算 1~5 張為 1000~5000 股
                }

                const type = (typeRaw === "買進") ? "BUY" : "SELL";

                // 驗證組別與密碼
                if (!traders[group]) {
                    logMarket(`[無效委託] 第 ${i+1} 列: ${group || '未知組別'} 密碼錯誤或格式不符`);
                    continue;
                }

                if (isNaN(price) || price <= 0 || isNaN(qty) || qty < 1000) {
                    logMarket(`[無效委託] 第 ${i+1} 列: 價格或股數無效 (股數需為 1,000 股以上)`);
                    continue;
                }

                // 進行資金與持股風控防呆
                const trader = traders[group];
                if (type === "BUY") {
                    const reqCash = price * qty;
                    if (trader.cash < reqCash) {
                        logMarket(`[拒絕委託] 第 ${i+1} 列: ${group} 可用現金不足！需 $${reqCash.toLocaleString()}，現有 $${trader.cash.toLocaleString()}`);
                        continue;
                    }
                    trader.cash -= reqCash;
                    trader.frozenCash += reqCash;
                } else {
                    if (trader.stock < qty) {
                        logMarket(`[拒絕委託] 第 ${i+1} 列: ${group} 可用股票不足！需 ${qty.toLocaleString()} 股，現有 ${trader.stock.toLocaleString()} 股`);
                        continue;
                    }
                    trader.stock -= qty;
                    trader.frozenStock += qty;
                }

                // 成立有效委託，進入撮合引擎
                logMarket(`[收到委託] ${group} ${type === 'BUY' ? '買進' : '賣出'} ${qty.toLocaleString()} 股 @ $${price}`);
                matchOrders({ group, type, price, qty, timestamp: new Date() });
            }

            processedRowCount = rows.length; // 更新已處理列數
            updateTraderTable();
            renderOrderBook();
        }

        // --- 自動撮合引擎邏輯 ---
        function matchOrders(incomingOrder) {
            if (incomingOrder.type === 'BUY') {
                while (incomingOrder.qty > 0 && sellOrders.length > 0) {
                    let bestSell = sellOrders[0];
                    if (incomingOrder.price >= bestSell.price) {
                        let matchPrice = bestSell.price; // 以先掛單者的價格成交
                        let matchQty = Math.min(incomingOrder.qty, bestSell.qty);

                        executeTrade(incomingOrder.group, bestSell.group, matchPrice, matchQty, incomingOrder.price);

                        incomingOrder.qty -= matchQty;
                        bestSell.qty -= matchQty;
                        if (bestSell.qty === 0) sellOrders.shift();
                    } else { break; }
                }
                if (incomingOrder.qty > 0) {
                    buyOrders.push(incomingOrder);
                    buyOrders.sort((a, b) => b.price - a.price || a.timestamp - b.timestamp);
                }
            } else {
                while (incomingOrder.qty > 0 && buyOrders.length > 0) {
                    let bestBuy = buyOrders[0];
                    if (incomingOrder.price <= bestBuy.price) {
                        let matchPrice = bestBuy.price; // 以先掛單者的價格成交
                        let matchQty = Math.min(incomingOrder.qty, bestBuy.qty);

                        executeTrade(bestBuy.group, incomingOrder.group, matchPrice, matchQty, bestBuy.price);

                        incomingOrder.qty -= matchQty;
                        bestBuy.qty -= matchQty;
                        if (bestBuy.qty === 0) buyOrders.shift();
                    } else { break; }
                }
                if (incomingOrder.qty > 0) {
                    sellOrders.push(incomingOrder);
                    sellOrders.sort((a, b) => a.price - b.price || a.timestamp - b.timestamp);
                }
            }
        }

        // 結算劃撥
        function executeTrade(buyerGroup, sellerGroup, price, qty, buyOrderPrice) {
            const tradeAmount = price * qty;
            const buyer = traders[buyerGroup];
            const seller = traders[sellerGroup];

            buyer.stock += qty;
            const frozenAllocated = buyOrderPrice * qty;
            buyer.frozenCash -= frozenAllocated;
            buyer.cash += (frozenAllocated - tradeAmount); // 退還差額

            seller.cash += tradeAmount;
            seller.frozenStock -= qty;

            lastPrice = price;
            document.getElementById('last-price').textContent = lastPrice;
            logMarket(`<span style="color:#81c784; font-weight:bold;">【成功成交】$${price} | ${qty.toLocaleString()} 股 | 買方: ${buyerGroup} | 賣方: ${sellerGroup}</span>`);
        }

        // 畫面渲染：五檔掛單
        function renderOrderBook() {
            const tbody = document.getElementById('orderbook-body');
            tbody.innerHTML = '';

            let aggregatedSells = aggregateOrders(sellOrders, 'SELL').slice(0, 5).reverse();
            let aggregatedBuys = aggregateOrders(buyOrders, 'BUY').slice(0, 5);

            aggregatedSells.forEach(item => {
                tbody.innerHTML += `<tr class="sell-row"><td>賣出 (Ask)</td><td>$${item.price.toFixed(2)}</td><td>${item.totalQty.toLocaleString()} 股</td></tr>`;
            });
            if (aggregatedSells.length === 0) {
                tbody.innerHTML += `<tr class="sell-row"><td colspan="3" style="text-align:center; color:#666;">無賣出委託</td></tr>`;
            }

            tbody.innerHTML += `<tr><td colspan="3" style="border-top:2px solid var(--accent-color); padding:2px;"></td></tr>`;

            if (aggregatedBuys.length === 0) {
                tbody.innerHTML += `<tr class="buy-row"><td colspan="3" style="text-align:center; color:#666;">無買進委託</td></tr>`;
            }
            aggregatedBuys.forEach(item => {
                tbody.innerHTML += `<tr class="buy-row"><td>買進 (Bid)</td><td>$${item.price.toFixed(2)}</td><td>${item.totalQty.toLocaleString()} 股</td></tr>`;
            });
        }

        function aggregateOrders(orders, type) {
            let map = new Map();
            orders.forEach(o => map.set(o.price, (map.get(o.price) || 0) + o.qty));
            let res = [];
            map.forEach((totalQty, price) => res.push({ price, totalQty }));
            return res.sort((a, b) => type === 'BUY' ? b.price - a.price : a.price - b.price);
        }

        // 畫面渲染：13 組資產監控表
        function updateTraderTable() {
            const tbody = document.getElementById('trader-asset-body');
            tbody.innerHTML = '';
            Object.keys(traders).forEach(group => {
                const t = traders[group];
                const priceCalc = lastPrice || 0;
                const totalAsset = (t.cash + t.frozenCash) + ((t.stock + t.frozenStock) * priceCalc);

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${group}</strong></td>
                        <td>$${Math.round(t.cash).toLocaleString()}</td>
                        <td>${t.stock.toLocaleString()} 股</td>
                        <td>$${Math.round(t.frozenCash).toLocaleString()}</td>
                        <td>${t.frozenStock.toLocaleString()} 股</td>
                        <td style="color:var(--accent-color);">$${Math.round(totalAsset).toLocaleString()}</td>
                    </tr>`;
            });
        }

        function logMarket(msg) {
            const logBox = document.getElementById('market-log');
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML = `<div><span style="color:#666;">[${timeStr}]</span> ${msg}</div>` + logBox.innerHTML;
        }

        function resetMarket() {
            if (confirm("確定要重置市場嗎？將會重新載入並還原所有交易狀態！")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
